[package]
name = "lemonbot"
version = "3.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
dotenvy = "0.15.7"
poise = "0.6.1"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = [ "json" ] }
ron = "0.12.0"
serde = "1.0.228"
serde_json = "1.0.145"
serenity = { version = "0.12.4", features = ["standard_framework", "voice", "cache"] }
songbird = { version = "0.5.0", features = ["builtin-queue"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio-rustls", "postgres" ] }
symphonia = { version = "0.5.5", features = [ "all" ] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [ "full" ] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
